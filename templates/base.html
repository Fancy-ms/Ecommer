<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ store_tagline }}">
    <title>{% block title %}{{ store_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">{{ store_name }}</a>
        <nav class="navigation">
            <a href="/">Shop</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
        </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-footer">
        <div>
            <a class="brand footer-brand" href="/">{{ store_name }}</a>
            <p>{{ store_tagline }}</p>
        </div>
        <div class="footer-links">
            <a href="/">Shop</a>
            <a href="/about">Our story</a>
            <a href="/contact">Contact</a>
        </div>
        <p class="copyright">© 2026 {{ store_name }}. All rights reserved.</p>
    </footer>
</body>
</html>
